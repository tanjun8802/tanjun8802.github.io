<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">My Portfolio</div>
            <!-- Hamburger Icon -->
            <button class="menu-icon" id="menu-icon" aria-label="Toggle navigation menu">&#9776;</button>
            <ul class="nav-links" id="nav-links">
                <li><a href="#about">About Me</a></li>
                <li><a href="#experience">Experience</a></li>
                <li><a href="#projects">Projects</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Hero Section with Carousel -->
        <section id="hero" class="hero">
            <div class="carousel" id="hero-carousel">
                <div class="carousel-inner" id="carousel-inner">
                    <!-- Carousel items injected by JS -->
                </div>
                <button class="carousel-prev" id="carousel-prev" aria-label="Previous image">&lt;</button>
                <button class="carousel-next" id="carousel-next" aria-label="Next image">&gt;</button>
            </div>

            <div class="hero-content">
                <h1>Hello, I'm <span class="highlight" id="hero-name">Name</span></h1>
                <p id="hero-tagline">Tagline</p>
                <a href="#about" class="btn">About me</a>
            </div>
        </section>

        <!-- About Me Section -->
        <section id="about" class="section">
            <h2>About Me</h2>
            <div class="about-container">
                <div class="about-image">
                    <div class="profile-placeholder" id="profile-img-preview"></div>
                </div>
                <div class="about-text">
                    <p id="about-text">About text goes here.</p>
                    <h3>Hobbies & Interests</h3>
                    <ul id="about-hobbies">
                        <!-- Hobbies injected by JS -->
                    </ul>
                    <a href="#" id="about-cv-link" class="btn secondary">Download CV</a>
                </div>
            </div>
        </section>

        <!-- Experience Section -->
        <section id="experience" class="section experience-split">
            <!-- Education Experience -->
            <div class="experience-half education-half">
                <h2>Education Experience</h2>
                <div class="git-graph-container" id="education-container">
                    <div class="git-graph-main-line"></div>
                    <!-- Education items injected by JS -->
                </div>
            </div>

            <!-- Work Experience -->
            <div class="experience-half work-half">
                <h2>Work Experience</h2>
                <div class="git-graph-container" id="work-container">
                    <div class="git-graph-main-line"></div>
                    <!-- Work items injected by JS -->
                </div>
            </div>
        </section>

        <!-- Projects / Repositories Section -->
        <section id="projects" class="section">
            <h2>My Projects & Repos</h2>
            <div class="grid" id="projects-grid">
                <!-- Project cards injected by JS -->
            </div>
        </section>

    </main>

    <!-- Project Details Modal -->
    <div id="project-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="close-modal">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <footer>
        <p>&copy; <span id="year"></span> [Your Name]. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
